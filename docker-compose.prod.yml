services:
  # ============================================================
  # 1. Database: PostgreSQL 16
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: udpvecsmart-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-udpvecsmart_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-udpvecsmart_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - udpvecsmart-network

  # ============================================================
  # 2. Backend API: Node.js (Express + Prisma)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udpvecsmart-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-udpvecsmart_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-key-32chars}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - udpvecsmart-network

  # ============================================================
  # 3. Frontend: React + Vite (Served with Nginx Alpine)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udpvecsmart-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - udpvecsmart-network

  # ============================================================
  # 4. (ตัวเลือกเสริม) Cloudflare Tunnel สำหรับเชื่อมโดเมน
  # หากต้องการรัน Cloudflare Tunnel ใน Docker ให้ใส่ Token ใน .env
  # ============================================================
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: udpvecsmart-cloudflared
  #   restart: always
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #   networks:
  #     - udpvecsmart-network

volumes:
  pgdata:
    driver: local

networks:
  udpvecsmart-network:
    driver: bridge

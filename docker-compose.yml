services:
  postgres:
    image: postgres:16-alpine
    container_name: udpvecsmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-udpvecsmart_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - udpvecsmart-network

  # (เสริม) pgAdmin: เครื่องมือดูฐานข้อมูลผ่านเว็บเบราว์เซอร์ที่ http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: udpvecsmart-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@udpvecsmart.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin1234}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - udpvecsmart-network

volumes:
  pgdata:
    driver: local

networks:
  udpvecsmart-network:
    driver: bridge

server {
    listen 80;
    server_name _;

    # ไม่บอกเวอร์ชัน nginx ใน header/หน้า error
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # รูปภาพอัปโหลดได้ไม่เกิน 30MB (เผื่อ overhead) — ข้อมูล JSON ปกติ backend จำกัด 2MB เอง
    client_max_body_size 32M;

    # Security headers (ใช้กับหน้าเว็บและไฟล์ static)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: สคริปต์ต้องมาจากเว็บเราเท่านั้น; สไตล์/ฟอนต์อนุญาต Google Fonts; รูปอนุญาตจากเว็บเรา, data:, blob: และ https (รูปข่าวจากเว็บข่าว); เรียก API เฉพาะเว็บเรา
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # SPA routing (React Router / Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to Backend container inside Docker network
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # header ความปลอดภัยของ API มาจาก helmet ที่ backend อยู่แล้ว — ตัดซ้ำเพื่อให้ใช้ชุดของ nginx ชุดเดียว ไม่ซ้อนกัน
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
